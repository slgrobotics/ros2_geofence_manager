geofence:
  name: home_area
  frame_id: map
  points:
    - {x: 0.0, y: 0.0}
    - {x: 10.0, y: 0.0}
    - {x: 10.0, y: 10.0}
    - {x: 0.0, y: 10.0}
    
geofence_manager:
  ros__parameters:
    geofence_file: ""
    pose_topic: "/robot_pose"
    pose_source_type: "pose_stamped"   # pose_stamped | odometry
    world_frame: "map"
    robot_frame: "base_link"
    near_boundary_threshold_m: 2.0
    publish_markers: true
    publish_rate_hz: 5.0
